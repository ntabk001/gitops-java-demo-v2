apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: java-demo
resources:
  - ../../base
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: java-demo-config
    literals:
      - APP_NAME=java-demo
      - APP_ENV=lab
      - APP_MESSAGE=Hello from GitOps with ArgoCD + SOPS
      - SHOW_SECRET=true

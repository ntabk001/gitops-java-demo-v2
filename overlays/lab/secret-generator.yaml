apiVersion: goabout.com/v1beta1
kind: SopsSecretGenerator
metadata:
  name: java-demo-secret
type: Opaque
# envs: file dạng KEY=VALUE đã mã hoá -> mỗi KEY thành một key trong Secret (dùng cho envFrom)
envs:
  - secret.env
# files: file bất kỳ đã mã hoá -> tên file thành key trong Secret (dùng để mount thành file)
files:
  - application-secret.properties

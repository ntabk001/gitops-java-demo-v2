apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-demo
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - java.samsungsdsvn.com       # dùng chứng chỉ wildcard mặc định của controller (C.4)
  rules:
    - host: java.samsungsdsvn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-demo
                port:
                  number: 80
